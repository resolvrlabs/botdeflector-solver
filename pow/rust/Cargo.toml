[package]
name = "botdeflector-pow"
description = "Solver for the graph-cycle proof-of-work in Queue-it's BotDeflector challenge"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/resolvrlabs/botdeflector-solver"
publish = false

[dependencies]
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[profile.release]
strip = true
lto = true
codegen-units = 1
